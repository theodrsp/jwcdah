<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- External Css -->
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- internal -->
     <style>
        .user-name {
            color: black;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .user-job{
            color: rgb(47, 36, 146);
            font-size: 14px;
        }
     </style>

     <div class="profile-card">
        <h2 class="user-name">Alex Johnson</h2>
        <p class="user-job">Web Developer</p>

        <button style="background-color: brown; color: white;">Follow Profile</button>

        <div class="profile-header">
            <span class="profile-status">Available for Hire</span>
        </div>

        <div class="profile-stats">
            <div class="stat-number">1,250</div>
            <div class="stat-label">Project Completed</div>
        </div>

        <div class="mp-simulator-body">
            <div class="mp-simulator-desc">
                <p>Ini adalah contoh untuk margin dan padding</p>
            </div>
        </div>
     </div>
</body>
</html>
